# Finds the newest Timetable 2026 GTFS resource, pins its hash, builds the matrix and fetches the 30
# SPEC 11.2 reference journeys from transport.opendata.ch. Run from Actions -> "Travel evidence";
# it opens a pull request with the data (close and reopen it to start CI). Terms: name the source.
name: Travel evidence

on:
  workflow_dispatch:
    inputs:
      service_date:
        description: Reference Tuesday (YYYY-MM-DD)
        required: true
        default: '2026-10-27'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: travel-evidence
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SERVICE_DATE: ${{ inputs.service_date || '2026-10-27' }}
      CKAN: https://data.opentransportdata.swiss/api/3/action/package_show?id=timetable-2026-gtfs2020
      PERMALINKS: >-
        https://data.opentransportdata.swiss/dataset/timetable-2026-gtfs2020/permalink
        https://opentransportdata.swiss/de/dataset/timetable-2026-gtfs2020/permalink
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.15
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Find and pin newest GTFS resource
        run: |
          mkdir -p evidence
          url=""
          code=$(curl -sSL --retry 3 -o "$RUNNER_TEMP/package.json" -w '%{http_code}' "$CKAN" || true)
          echo "::notice title=CKAN package_show::HTTP $code"
          if [ "$code" = 200 ]; then
            url=$(python3 -c 'import json,sys; r=[x for x in json.load(open(sys.argv[1]))["result"]["resources"] if (x.get("url") or "").lower().endswith(".zip")]; r.sort(key=lambda x: x.get("created") or "", reverse=True); print(r[0]["url"])' "$RUNNER_TEMP/package.json" || true)
          fi
          if [ -n "$url" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/gtfs.zip" "$url"
          else
            # The permalink redirects to a short-lived signed GET URL of the newest resource.
            for permalink in $PERMALINKS; do
              resolved=$(curl -sSL --retry 3 -o "$RUNNER_TEMP/gtfs.zip" -w '%{http_code} %{url_effective}' "$permalink" || true)
              echo "::notice title=Permalink::$permalink -> ${resolved%%\?*}"
              case "$resolved" in 200\ http*) url=${resolved#200 }; url=${url%%\?*}; break ;; esac
            done
          fi
          [ -n "$url" ] || { echo "::error::No GTFS resource found"; exit 1; }
          sha=$(sha256sum "$RUNNER_TEMP/gtfs.zip" | cut -d' ' -f1)
          bytes=$(stat -c %s "$RUNNER_TEMP/gtfs.zip")
          printf 'GTFS_URL=%s\nGTFS_SHA256=%s\nGTFS_BYTES=%s\n' "$url" "$sha" "$bytes" | tee evidence/feed.env >> "$GITHUB_ENV"
          echo "::notice title=GTFS feed::$url sha256=$sha bytes=$bytes"
          unzip -l "$RUNNER_TEMP/gtfs.zip" > evidence/feed-contents.txt
      - name: Unit tests
        run: python3 -m unittest discover -s tests/travel
      - name: Build matrix
        run: |
          /usr/bin/time -v python3 scripts/travel/run_matrix.py --gtfs "$RUNNER_TEMP/gtfs.zip" --date "$SERVICE_DATE" \
            --feed-url "$GTFS_URL" 2>&1 | tee evidence/matrix.log
          echo "::notice title=Matrix::$(grep -E 'rows=' evidence/matrix.log | tr '\n' ' ' | cut -c1-3500)"
          echo "::notice title=Resources::$(grep -E 'Elapsed|Maximum resident' evidence/matrix.log | tr '\n' ' ')"
      - name: Fetch reference journeys (transport.opendata.ch)
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/travel/fetch_reference.py --date "$SERVICE_DATE" 2>&1 | tee evidence/reference-fetch.log
          echo "::notice title=Reference::$(cut -c1-120 evidence/reference-fetch.log | tr '\n' '|' | cut -c1-3800)"
      - name: Compare
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/travel/compare_reference.py 2>&1 | tee evidence/compare.log || true
          echo "::notice title=Compare::$(tr '\n' '|' < evidence/compare.log | cut -c1-3800)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: travel-evidence
          path: |
            evidence
            site/data/travel/matrix
            tests/travel/sbb-reference-2026.csv
      - name: Regenerate release manifest and check the site still builds
        if: ${{ success() }}
        run: |
          npm ci
          PAGES_BASE=/steuerpendler/ npm run build
          npm test
      - name: Gate (SPEC 6.5c)
        run: python3 scripts/travel/compare_reference.py --require-complete
      - name: Commit data and open a pull request
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add site/data/travel/matrix tests/travel/sbb-reference-2026.csv site/data/manifest.json site/data/release.json
          git diff --cached --quiet && { echo "::notice::Data unchanged"; exit 0; }
          source evidence/feed.env
          message="data(travel): matrix and SBB reference journeys for ${SERVICE_DATE}"
          details="Feed: ${GTFS_URL} (sha256 ${GTFS_SHA256}). Reference: transport.opendata.ch. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git commit -m "$message" -m "$details"
          if [[ "$GITHUB_REF_NAME" == claude/travel-matrix-* ]]; then git push origin "HEAD:${GITHUB_REF_NAME}"; exit 0; fi
          branch="data/travel-matrix-${SERVICE_DATE}-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${branch}"
          { echo "$details"; echo; echo '```'; cat evidence/compare.log; echo '```'; } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "$message" --body-file "$RUNNER_TEMP/body.md"
