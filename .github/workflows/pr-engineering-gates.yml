name: PR engineering gates

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-engineering-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.15
      - run: npm ci
      - name: Unit gate
        run: npm test
      - name: ESTV reference catalogue gate
        env:
          PYTHONPATH: scripts/reference
        run: python3 -m unittest scripts.reference.test_estv_collector -v
      - name: Release gate
        run: npm run release:test
      - name: Production build gate
        run: npm run build