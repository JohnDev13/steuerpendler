name: Canonical event pilot checks

on:
  push:
    branches: [feat/canonical-event-pilot-20261025]
  pull_request:
    paths:
      - '.github/workflows/canonical-event-pilot.yml'
      - 'scripts/travel/**'
      - 'tests/travel/**'
      - 'docs/travel/canonical-event-pilot-decision.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-event-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering:
    name: Pilot and site engineering checks (not release acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PAGES_BASE: /steuerpendler/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.15
      - run: npm ci
      - name: Travel suite including canonical event pilot
        run: python3 -m unittest discover -s tests/travel -v
      - name: Browser unit tests
        run: npm test
      - name: Release inventory tests
        run: npm run release:test
      - name: Prefix-correct production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full Playwright suite
        run: npm run test:e2e
