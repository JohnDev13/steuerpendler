name: Feed stats (throwaway)
on:
  push:
    branches: ['claude/feed-stats']
permissions:
  contents: read
jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.15
      - run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gtfs.zip" https://data.opentransportdata.swiss/dataset/timetable-2026-gtfs2020/permalink
          echo "::notice title=sha::$(sha256sum "$RUNNER_TEMP/gtfs.zip")"
          python3 scripts/travel/feed_stats.py "$RUNNER_TEMP/gtfs.zip" 2026-10-27
