# Fetches the official BAG basic health-insurance premiums and the Gemeinde -> premium-region lists into data/kk/raw
# and commits them to the pushing claude/kk-* branch (SHA-256 per file in data/kk/raw/manifest.json).
name: BAG premiums

on:
  workflow_dispatch:
  push:
    branches: ['claude/kk-*']
    paths: ['scripts/kk/fetch.py', '.github/workflows/bag-premiums.yml']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.15
      - run: python3 scripts/kk/fetch.py --years 2026 2027 2>&1 | tee "$RUNNER_TEMP/fetch.log"
      - run: echo "::notice title=KK files::$(grep '^::notice' "$RUNNER_TEMP/fetch.log" | sed 's/::notice title=KK fetch:://' | tr '\n' '|' | cut -c1-3800)"
      - if: ${{ failure() }}
        run: echo "::error title=KK fetch::$(grep -v '^::notice' "$RUNNER_TEMP/fetch.log" | tail -n 25 | tr '\n' '|' | cut -c1-3800)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/kk/raw
          git diff --cached --quiet && exit 0
          git commit -m "data(kk): BAG premium data and premium-region lists" -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
