# Builds site/data/travel/matrix/ from an opentransportdata.swiss GTFS feed and opens a data PR.
# Run from Actions -> "Build travel matrix" -> Run workflow, with the URL of a GTFS_FP2026_<date>.zip
# resource from https://data.opentransportdata.swiss/dataset/timetable-2026-gtfs2020 (terms: name the source).
# PRs opened with GITHUB_TOKEN do not start CI on their own; close and reopen the PR to run it.
name: Build travel matrix

on:
  workflow_dispatch:
    inputs:
      gtfs_url:
        description: GTFS zip URL (Timetable 2026 GTFS2020 resource)
        required: true
      gtfs_sha256:
        description: Expected pinned SHA-256 of the GTFS zip (64 lowercase hex digits)
        required: true
      service_date:
        description: Reference Tuesday (YYYY-MM-DD)
        required: true
        default: '2026-10-27'
      open_pr:
        description: Open a pull request with the generated files
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-travel
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GTFS_URL: ${{ inputs.gtfs_url }}
      GTFS_SHA256: ${{ inputs.gtfs_sha256 }}
      SERVICE_DATE: ${{ inputs.service_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.15
      - name: Download feed
        run: |
          if [[ ! "$GTFS_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::A pinned 64-character lowercase GTFS SHA-256 is required"; exit 1
          fi
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gtfs.zip" "$GTFS_URL"
          actual=$(sha256sum "$RUNNER_TEMP/gtfs.zip" | cut -d' ' -f1)
          echo "GTFS sha256 $actual ($(stat -c %s "$RUNNER_TEMP/gtfs.zip") bytes)"
          if [ "$GTFS_SHA256" != "$actual" ]; then
            echo "::error::GTFS hash mismatch: expected $GTFS_SHA256, got $actual"; exit 1
          fi
      - name: Unit tests
        run: python3 -m unittest discover -s tests/travel
      - name: Build matrix
        run: python3 scripts/travel/run_matrix.py --gtfs "$RUNNER_TEMP/gtfs.zip" --date "$SERVICE_DATE" --feed-url "$GTFS_URL" | tee "$RUNNER_TEMP/matrix.log"
      - name: Compare with SBB reference pairs
        run: |
          python3 scripts/travel/compare_reference.py | tee "$RUNNER_TEMP/reference.log" || echo "::warning::SBB reference pairs outside the 3-minute tolerance; see the job log and the PR body."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Regenerate release manifest and check the site still builds
        run: |
          npm run release:build
          PAGES_BASE=/steuerpendler/ npm run build
          npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: travel-matrix-${{ inputs.service_date }}
          path: |
            site/data/travel/matrix
            site/data/manifest.json
            site/data/release.json
      - name: Open pull request
        if: inputs.open_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="data/travel-matrix-${SERVICE_DATE}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add site/data/travel/matrix site/data/manifest.json site/data/release.json
          git commit -m "data(travel): Gemeinde matrix for ${SERVICE_DATE}" -m "Feed: ${GTFS_URL}"
          git push origin "$branch"
          {
            echo "Generated by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo
            echo "Feed: ${GTFS_URL}"
            echo
            echo '```'; cat "$RUNNER_TEMP/matrix.log"; echo '```'
            echo
            echo 'SBB reference pairs (SPEC 11.2):'
            echo '```'; cat "$RUNNER_TEMP/reference.log"; echo '```'
            echo
            echo 'Experimental observed-positive matrix; absent Gemeinde/destination pairs remain unknown.'
            echo 'Do not merge or enable availability.travel without source-completeness, direct-route and reference audits.'
            echo
            echo 'Close and reopen this PR to run CI.'
          } > "$RUNNER_TEMP/body.md"
          gh pr create --draft --base main --head "$branch" --title "data(travel): provisional Gemeinde candidates for ${SERVICE_DATE}" --body-file "$RUNNER_TEMP/body.md"
