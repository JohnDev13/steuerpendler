name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    name: Preview engineering checks (not production acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PAGES_BASE: /steuerpendler/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.15
      - run: npm ci
      - run: node --test scripts/ci/workflow.test.mjs
      - run: npm test
      - run: npm run release:test
      - run: npm run map:test
      - run: python3 -m unittest discover -s tests/travel -v
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/content/*.test.mjs
      - run: npm run test:e2e
  tax-accuracy:
    name: Tax accuracy gate (must pass before release)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      # The existing off-grid failure is deliberately visible and blocks release.
      - run: npm run tax:test
